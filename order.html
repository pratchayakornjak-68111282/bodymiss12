<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">BODY SCENT</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head center">
          <h1>ยืนยันการสั่งซื้อ</h1>
          <hr class="mood-line">
          <p class="lead">กรอกข้อมูลติดต่อของคุณ แล้วกดยืนยันสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="form-card">
          <div class="form-row">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="form-row">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="off" required>
          </div>

          <div class="form-row">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="form-row">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="numeric" required>
          </div>

          <div class="form-row">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note"></textarea>
          </div>

          <button type="submit" class="btn btn-primary">ยืนยันสั่งซื้อ</button>
        </form>

        <p class="center muted" style="margin: var(--space-3) auto 0;">
          ต้องการเลือกสินค้าเพิ่ม? <a href="product.html">กลับไปดูสินค้า</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a class="brand" href="index.html">BODY SCENT</a>
      <p>&copy; 2026 Body Scent สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
